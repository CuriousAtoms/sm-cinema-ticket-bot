name: SM Cinema Ticket Checker (Browser Fallback)

on:
  # Manual trigger only for cross-checking against the headless browser path
  workflow_dispatch:

jobs:
  check-tickets-browser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run ticket checker (browser fallback)
        env:
          USE_BROWSER_FALLBACK: "1"
          MOVIE_URL: ${{ secrets.MOVIE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENTION: ${{ secrets.MENTION }}
        run: python checker.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state.json [skip ci]"
          git push
